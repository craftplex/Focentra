name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Fallback .env
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify release signing fails closed without credentials
        env:
          KEYSTORE_PATH: ''
          STORE_PASSWORD: ''
          KEY_PASSWORD: ''
          KEY_ALIAS: ''
        run: |
          if ./gradlew validateReleaseSigning --no-daemon --stacktrace > signing-validation.log 2>&1; then
            echo "::error::Release signing validation unexpectedly passed without credentials."
            exit 1
          fi
          if ! grep -q "Release signing is not configured" signing-validation.log; then
            cat signing-validation.log
            echo "::error::Release signing validation failed for an unexpected reason."
            exit 1
          fi
          echo "Release signing correctly rejected missing credentials."

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focentra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
