name: Build Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (for example, v8.0.8)'
        required: false
        default: 'v8.0.8'

permissions:
  contents: write

env:
  APP_VERSION: v8.0.8

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Release Keystore & Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD_SECRET" ] || [ -z "$KEY_PASSWORD_SECRET" ] || [ -z "$KEY_ALIAS_SECRET" ]; then
            echo "::error::Release signing secrets are missing. Configure KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS."
            exit 1
          fi

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks || [ ! -s release-keystore.jks ]; then
            echo "::error::KEYSTORE_BASE64 is not a valid, non-empty base64-encoded keystore."
            exit 1
          fi
          if ! keytool -list -keystore release-keystore.jks -storepass "$STORE_PASSWORD_SECRET" -alias "$KEY_ALIAS_SECRET" > /dev/null 2>&1; then
            echo "::error::The configured keystore, store password, or key alias is invalid."
            exit 1
          fi

          echo "Using configured repository release keystore."
          echo "KEYSTORE_FILE=$(pwd)/release-keystore.jks" >> "$GITHUB_ENV"
          echo "STORE_PASS=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "KEY_ALIAS_ENV=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"

      - name: Recreate .env file
        env:
          ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        run: |
          if [ -n "$ENV_FILE_CONTENTS" ]; then
            echo "$ENV_FILE_CONTENTS" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
          KEY_ALIAS: ${{ env.KEY_ALIAS_ENV }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Extract App Version Name
        id: get_version
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*["\x27]([^"\x27]+)["\x27].*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.1.0"
          fi
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "VERSION_RAW=$VERSION" >> $GITHUB_ENV
          echo "Detected App Version: v$VERSION"

      - name: Copy & Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" "focentra-${APP_VERSION}-release.apk"
          cp "$APK_FILE" focentra-release.apk
          ls -la focentra*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focentra-release-apk
          path: |
            focentra-*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || env.APP_VERSION }}
          name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('Focentra {0}', env.APP_VERSION) }}
          files: |
            focentra-*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
